name: CI-CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  OWNER: dlaramide
  REPO: hng14-stage2-devops


jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python lint tools
        run: pip install flake8

      - name: Python lint (API + Worker)
        run: flake8 api worker --exclude=venv,__pycache__

      - name: Setup Node (frontend lint requirement)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Frontend lint
        run: |
          cd frontend
          npx eslint .


  hadolint:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint on API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
           dockerfile: api/Dockerfile
           ignore: DL3008,DL3018

      - name: Run Hadolint on Worker Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: worker/Dockerfile
          ignore: DL3008,DL3018

      - name: Run Hadolint on Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          ignore: DL3008,DL3018


  test:
    runs-on: ubuntu-latest
    needs: [lint, hadolint]

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install pytest httpx pytest-cov
          pip install -r api/requirements.txt

      - name: Run tests with coverage
        run: PYTHONPATH=. pytest -q --cov=api --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml


  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Enable Docker BuildKit
      run: echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV

    - name: Login to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    # ---------- API ----------
    - name: Build API image
      run: |
        docker build \
          --cache-from=type=gha \
          --cache-to=type=gha,mode=max \
          -t ghcr.io/${OWNER}/${REPO}/api:${{ github.sha }} \
          ./api

    # ---------- Worker ----------
    - name: Build Worker image
      run: |
        docker build \
          --cache-from=type=gha \
          --cache-to=type=gha,mode=max \
          -t ghcr.io/${OWNER}/${REPO}/worker:${{ github.sha }} \
          ./worker

    # ---------- Frontend ----------
    - name: Build Frontend image
      run: |
        docker build \
          --cache-from=type=gha \
          --cache-to=type=gha,mode=max \
          -t ghcr.io/${OWNER}/${REPO}/frontend:${{ github.sha }} \
          ./frontend

    # ---------- Push ----------
    - name: Push images
      run: |
        docker push ghcr.io/${OWNER}/${REPO}/api:${{ github.sha }}
        docker push ghcr.io/${OWNER}/${REPO}/worker:${{ github.sha }}
        docker push ghcr.io/${OWNER}/${REPO}/frontend:${{ github.sha }}

  security:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo tee /etc/apt/trusted.gpg.d/trivy.asc
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan API image
        run: trivy image --format sarif -o api.sarif ghcr.io/${OWNER}/${REPO}/api:${{ github.sha }} --severity CRITICAL

      - name: Scan Worker image
        run: trivy image --format sarif -o worker.sarif ghcr.io/${OWNER}/${REPO}/worker:${{ github.sha }} --severity CRITICAL

      - name: Scan Frontend image
        run: trivy image --format sarif -o frontend.sarif ghcr.io/${OWNER}/${REPO}/frontend:${{ github.sha }} --severity CRITICAL

      - name: Merge SARIF files
        run: |
          jq -s '.[0] * .[1] * .[2]' api.sarif worker.sarif frontend.sarif > trivy.sarif

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

  integration:
    runs-on: ubuntu-latest
    needs: security

    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for API health
        run: sleep 20

      - name: Create job
        run: curl -X POST http://localhost:8000/jobs

      - name: Check job status endpoint
        run: curl http://localhost:8000/health

      - name: Tear down
        if: always()
        run: docker compose down

  deploy:
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy with rolling update
        run: |
          docker compose pull || true
          docker compose up -d --build

      - name: Verify health
        run: sleep 15