name: CI-CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Lint API + Worker
        run: flake8 api worker

  test:
    runs-on: ubuntu-latest
    needs: lint   # 👈 IMPORTANT: runs only if lint passes

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r api/requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest -q