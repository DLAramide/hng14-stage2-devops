name: CI-CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  PYTHON_VERSION: "3.11"

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python lint tools
        run: pip install flake8

      - name: Python lint (API + Worker)
        run: flake8 api worker --exclude=venv,__pycache__

      - name: Setup Node (frontend lint requirement)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend lint deps
        run: |
          cd frontend
          npm install
          npm install eslint

      - name: Frontend lint
        run: |
          cd frontend
          npx eslint .

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install pytest httpx pytest-cov
          pip install -r api/requirements.txt

      - name: Run tests with coverage
        run: PYTHONPATH=. pytest -q --cov=api --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml


  build:
    runs-on: ubuntu-latest
    needs: test

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t localhost:5000/api-service:${{ github.sha }} ./api
       

      - name: Build Worker image
        run: docker build -t localhost:5000/worker-service:${{ github.sha }} ./worker
         

      - name: Build Frontend image
        run: docker build -t localhost:5000/frontend-service:${{ github.sha }} ./frontend

      - name: Push images
        run: |
          docker push localhost:5000/api-service:${{ github.sha }}
          docker push localhost:5000/worker-service:${{ github.sha }}
          docker push localhost:5000/frontend-service:${{ github.sha }}  
  
  security:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg

          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo tee /etc/apt/trusted.gpg.d/trivy.asc

          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee -a /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan API image
        run: trivy image localhost:5000/api-service:${{ github.sha }} --exit-code 1 --severity CRITICAL

      - name: Scan Worker image
        run: trivy image localhost:5000/worker-service:${{ github.sha }} --exit-code 1 --severity CRITICAL

      - name: Scan Frontend image
        run: trivy image localhost:5000/frontend-service:${{ github.sha }} --exit-code 1 --severity CRITICAL

  integration:
    runs-on: ubuntu-latest
    needs: security

    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for API health
        run: sleep 20

      - name: Create job
        run: curl -X POST http://localhost:8000/jobs

      - name: Check job status endpoint
        run: curl http://localhost:8000/health

      - name: Tear down
        if: always()
        run: docker compose down

  deploy:
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy with rolling update
        run: |
          docker compose pull || true
          docker compose up -d --build

      - name: Verify health
        run: sleep 15